; ESP32-C5 needs arduino-esp32 3.x, which stock espressif32 may not ship; pioarduino does.
; Verify the platform URL/board name if the first build fails.
[env:tdongle_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^7

; Bring-up image: serial logging only. Build with `pio run -e diag`.
[env:diag]
platform = ${env:tdongle_c5.platform}
board = ${env:tdongle_c5.board}
framework = arduino
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../diag/main.cpp>
